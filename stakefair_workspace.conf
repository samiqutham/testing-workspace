server {
    listen 80;
    index index.html index.htm index.nginx-debian.html index.php index.html;
    server_name stakefair.yourdesign.live;


    location / {
        proxy_pass http://localhost:3101/;  # Replace with the port your Next.js app is running on
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    
    location ~/_next/static/ {
    proxy_pass http://localhost:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}


    location ~/api {
        limit_req zone=one burst=25 nodelay;
            proxy_pass http://share-app-dev-nlb-2512faa4119131a7.elb.ap-south-1.amazonaws.com:2083;
            add_header Cache-Control "max-age=14400";
            proxy_cache api_route;
            proxy_cache_methods POST;
            proxy_cache_key "$host$request_uri$request_body";
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        proxy_cache_valid any 120s;
        add_header X-Cached $upstream_cache_status;

    }

    location ~/app {
        limit_req zone=one burst=25 nodelay;
        proxy_pass http://backend_app;


    }
}


