<svg width="360" height="64" viewBox="0 0 360 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Play Button Green Gradient -->
    <linearGradient id="playGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    
    <!-- Casino Gold Gradient -->
    <linearGradient id="casinoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
    
    <!-- Casino Red Gradient (for one card) -->
    <linearGradient id="casinoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="50%" stop-color="#DC143C"/>
      <stop offset="100%" stop-color="#B22222"/>
    </linearGradient>
    
    <!-- Search Icon Color -->
    <linearGradient id="searchGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#708090"/>
      <stop offset="100%" stop-color="#556070"/>
    </linearGradient>
  </defs>
  
